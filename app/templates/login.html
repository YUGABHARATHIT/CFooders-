
{% extends 'base.html' %}

{% block content %}

<style>
.login-container {
    width: 100%;
    min-height: 75vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px;
    box-sizing: border-box;
}

.login-card {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    box-sizing: border-box;
}

.login-card h1 {
    text-align: center;
    font-size: 30px;
    margin: 0 0 10px;
    color: #222;
}

.login-card .subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

.login-card form {
    width: 100%;
}

.login-card label {
    display: block;
    margin: 14px 0 7px;
    font-weight: 600;
    color: #333;
}

.login-card input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
    outline: none;
}

.login-card input:focus {
    border-color: #ff6b35;
    box-shadow: 0 0 0 3px rgba(255,107,53,0.12);
}

.login-card button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #ff6b35;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-card button:hover {
    background: #e95725;
}

.register-link {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
}

.register-link a {
    color: #ff6b35;
    font-weight: bold;
    text-decoration: none;
}

/* Mobile responsive */
@media (max-width: 480px) {
    .login-container {
        min-height: 70vh;
        padding: 20px 12px;
    }

    .login-card {
        padding: 25px 20px;
        border-radius: 12px;
    }

    .login-card h1 {
        font-size: 25px;
    }
}
</style>

<div class="login-container">
    <div class="login-card">
        <h1>🍔 Cfooders</h1>
        <p class="subtitle">Welcome back! Please login.</p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>

{% endblock %}
